version: "3.8"

services:
  mysqldb:
    image: mysql:5.7
    container_name: mysqldb
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: stationSki
      MYSQL_USER: user
      MYSQL_PASSWORD:
    ports:
      - "3307:3306"
    volumes:
      - ./mysql:/var/lib/mysql
    restart: unless-stopped

  gestionski:
    image: eyachamekh/eyachamekh-g5-stationski

    container_name: gestionski
    ports:
      - "8089:8089"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysqldb:3306/stationSki
      SPRING_DATASOURCE_USERNAME: user
      SPRING_DATASOURCE_PASSWORD: password
    depends_on:
      - mysqldb
    restart: unless-stopped
