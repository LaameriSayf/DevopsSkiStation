version: "3.8"

services:
  mahmoud-devops:
    image: ${NEXUS_REPO}/${IMAGE_NAME}:${IMAGE_TAG}
    container_name: eya-devops
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/GestionSki?autoReconnect=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
    depends_on:
      - mysql
    networks:
      - eya-network

  mysql:
    image: mysql:5.6
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: stationSki
    ports:
      - "3306:3306"
    volumes:
      - ./sito/db:/var/lib/mysql
    restart: unless-stopped
    networks:
      - eya-network

networks:
  mahmoud-network:
    driver: bridge
