version: '3.8'
services:
  app:
    image: ouday2025/devopsskistation:${IMAGE_TAG}
    ports:
      - "8090:8090"
    environment:
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/test_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true"
      SPRING_DATASOURCE_USERNAME: "root"
      SPRING_DATASOURCE_PASSWORD: "my-secret-pw"
    depends_on:
      - mysql
    networks:
      - mynetwork


  mysql:
    image: mysql:latest
    environment:
      MYSQL_ROOT_PASSWORD: "my-secret-pw"
      MYSQL_DATABASE: "test_db"
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - mynetwork


networks:
  mynetwork:
    driver: bridge

volumes:
  mysql-data:
