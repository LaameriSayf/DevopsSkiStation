version: "3.8"

services:
  # MySQL Database
  mysqldb:
    image: mysql:5.7
    container_name: mysqldb
    environment:
      - MYSQL_ROOT_PASSWORD=""  # Empty password for root user
      - MYSQL_DATABASE=stationSki
      - MYSQL_ALLOW_EMPTY_PASSWORD=yes
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped
    networks:
      - devops_network

  # Spring Boot Application (Gestionski)
  gestionski:
    image: 192.168.33.10:8082/mahmoudabdulkareem/gestion-stationski:latest
    container_name: gestionski
    ports:
      - "8089:8089"
    restart: unless-stopped
    volumes:
      - ./logs:/logs
    depends_on:
      - mysqldb
    networks:
      - devops_network

  # Jenkins
  jenkins:
    image: jenkins/jenkins:lts
    container_name: jenkins
    ports:
      - "8083:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
    restart: unless-stopped
    networks:
      - devops_network

  # Nexus
  nexus:
    image: sonatype/nexus3
    container_name: nexus
    ports:
      - "8084:8081"  # Change host port to 8084
      - "8085:8082"  # Change host port for Docker registry
    volumes:
      - nexus_data:/nexus-data
    restart: unless-stopped
    networks:
      - devops_network

  # SonarQube
  sonarqube:
    image: sonarqube:lts
    container_name: sonarqube
    ports:
      - "9000:9000"
    restart: unless-stopped
    networks:
      - devops_network

  # Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - /home/vagrant/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    depends_on:
      - gestionski
volumes:
  jenkins_home:
  nexus_data:
  mysql_data:  # Persistent volume for MySQL

networks:
  devops_network:
    driver: bridge
